# =====================================================================================
# Microservices Architecture Extension
# =====================================================================================
# This file extends the existing docker-compose setup with new microservices:
# - Document Processing Service (Port 8004)
# - Redis for caching and message queuing
# =====================================================================================

version: "3.8"

services:
  # =====================================================================================
  # Infrastructure Services
  # =====================================================================================
  
  # Redis for caching and background job queues
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]

  # =====================================================================================
  # Database Services (existing, just documented)
  # =====================================================================================
  
  # PostgreSQL Database
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: projectdb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d projectdb"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Neo4j Graph Database
  neo4j:
    image: neo4j:5.15
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    networks:
      - app-network
    restart: unless-stopped

  # Neo4j Lessons Database
  neo4j-lessons:
    image: neo4j:5.15
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    ports:
      - "7475:7474"
      - "7688:7687"
    volumes:
      - neo4j-lessons_data:/data
    networks:
      - app-network
    restart: unless-stopped

  # MinIO Object Storage
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - app-network
    restart: unless-stopped

  # =====================================================================================
  # Microservices
  # =====================================================================================
  
  # Document Processing Service
  document-service:
    build:
      context: ./services/document-service
      dockerfile: Dockerfile
    ports:
      - "8003:8003"
    environment:
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - LOG_LEVEL=INFO
    volumes:
      - ./services/document-service:/app
      - ./logs:/app/logs
      - ./markitdown_debug:/app/markitdown_debug
    depends_on:
      - redis
      - minio
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8003/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # =====================================================================================
  # Existing Services (maintained for compatibility)
  # =====================================================================================
  
  # Project Service
  project-service:
    build:
      context: ./project-service
    ports:
      - "8002:8002"
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/projectdb
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis
    networks:
      - app-network
    restart: unless-stopped

  # Reporting Service  
  reporting-service:
    build:
      context: ./reporting-service
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/projectdb
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    depends_on:
      - postgres
      - minio
    networks:
      - app-network
    restart: unless-stopped

  # Main Backend (API Gateway)
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/projectdb
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      # Microservice endpoints
      - DOCUMENT_SERVICE_URL=http://document-service:8003
      - PROJECT_SERVICE_URL=http://project-service:8002
      - REPORTING_SERVICE_URL=http://reporting-service:8001
    volumes:
      - ./backend/app:/app
      - ./logs:/app/logs
      - ./data:/app/data
    depends_on:
      - postgres
      - neo4j
      - redis
      - minio
      - document-service
    networks:
      - app-network
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - REACT_APP_DOCUMENT_SERVICE_URL=http://localhost:8003
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

  # Lessons Service (Phase 2 scaffold)
  lessons-service:
    build:
      context: ./services/lessons-service
    ports:
      - "8018:8018"
    environment:
      - PORT=8018
      - NEO4J_URI=bolt://neo4j-lessons:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
    depends_on:
      - neo4j-lessons
    networks:
      - app-network
    restart: unless-stopped

# =====================================================================================
# Networks and Volumes
# =====================================================================================

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j-lessons_data:
    driver: local
  minio_data:
    driver: local
  redis_data:
    driver: local
