version: "3.8"

services:
  markitdown-mcp:
    build:
      context: .
      dockerfile: ./docker/markitdown-mcp.Dockerfile
    command: ["--http", "--host", "0.0.0.0", "--port", "5001"]
    ports:
      - "5011:5001"
    restart: unless-stopped
    container_name: markitdown_mcp_service
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('127.0.0.1',5001), 2); print('ok')\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  weaviate:
    image: semitechnologies/weaviate:1.25.4
    container_name: weaviate
    restart: unless-stopped
    ports:
      - "8080:8080"  # HTTP
      # - "50051:50051" # gRPC (optional)
    environment:
      QUERY_DEFAULTS_LIMIT: "25"
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      DEFAULT_VECTORIZER_MODULE: "none"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      CLUSTER_HOSTNAME: "weaviate-node"
    volumes:
      - weaviate_data:/var/lib/weaviate

volumes:
  weaviate_data:
    driver: local
