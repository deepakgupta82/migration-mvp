apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-service
  labels:
    app: document-service
    component: microservice
spec:
  replicas: 2
  selector:
    matchLabels:
      app: document-service
  template:
    metadata:
      labels:
        app: document-service
    spec:
      containers:
      - name: document-service
        image: migration-platform/document-service:latest
        ports:
        - containerPort: 8004
        env:
        - name: LOG_LEVEL
          value: "INFO"
        - name: REDIS_URL
          value: "redis://redis:6379"
        - name: MINIO_ENDPOINT
          value: "minio:9000"
        - name: MINIO_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: minio-secret
              key: access-key
        - name: MINIO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: minio-secret
              key: secret-key
        - name: STORAGE_SERVICE_URL
          value: "http://storage-service:8010"
        - name: VECTOR_SERVICE_URL
          value: "http://vector-service:8005"
        - name: GRAPH_SERVICE_URL
          value: "http://graph-service:8006"
        - name: WEBSOCKET_SERVICE_URL
          value: "http://websocket-service:8009"
        - name: USE_ENHANCED_WORKFLOW
          value: "true"
        - name: ENABLE_VECTOR_INTEGRATION
          value: "true"
        - name: ENABLE_GRAPH_INTEGRATION
          value: "true"
        - name: ENABLE_WEBSOCKET_NOTIFICATIONS
          value: "true"
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        readinessProbe:
          httpGet:
            path: /health
            port: 8004
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8004
          initialDelaySeconds: 60
          periodSeconds: 30
        volumeMounts:
        - name: logs
          mountPath: /app/logs
        - name: temp-storage
          mountPath: /tmp
      volumes:
      - name: logs
        emptyDir: {}
      - name: temp-storage
        emptyDir:
          sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: document-service
  labels:
    app: document-service
spec:
  type: ClusterIP
  ports:
  - port: 8004
    targetPort: 8004
    protocol: TCP
  selector:
    app: document-service
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: document-service-config
data:
  CONVERSION_TIMEOUT_SEC: "90"
  PDF_MAX_PAGES: "50"
  MAX_CHUNKS: "0"
  DEBUG_DOCUMENT_CONVERSION_LOGS: "false"
  DOCUMENT_HTTP_TIMEOUT_SEC: "30"