server:
  http_listen_port: 9080
  grpc_listen_port: 9096

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: backend
    static_configs:
      - targets: []
        labels:
          job: backend
          service: backend
          __path__: /var/log/backend/*.log
  - job_name: project-service
    static_configs:
      - targets: []
        labels:
          job: project-service
          service: project-service
          __path__: /var/log/project-service/*.log
  - job_name: reporting-service
    static_configs:
      - targets: []
        labels:
          job: reporting-service
          service: reporting-service
          __path__: /var/log/reporting-service/*.log
  - job_name: document-service
    static_configs:
      - targets: []
        labels:
          job: document-service
          service: document-service
          __path__: /var/log/document-service/*.log
  - job_name: vector-service
    static_configs:
      - targets: []
        labels:
          job: vector-service
          service: vector-service
          __path__: /var/log/vector-service/*.log
  - job_name: graph-service
    static_configs:
      - targets: []
        labels:
          job: graph-service
          service: graph-service
          __path__: /var/log/graph-service/*.log
  - job_name: llm-service
    static_configs:
      - targets: []
        labels:
          job: llm-service
          service: llm-service
          __path__: /var/log/llm-service/*.log
  - job_name: websocket-service
    static_configs:
      - targets: []
        labels:
          job: websocket-service
          service: websocket-service
          __path__: /var/log/websocket-service/*.log
  - job_name: ai-agent-service
    static_configs:
      - targets: []
        labels:
          job: ai-agent-service
          service: ai-agent-service
          __path__: /var/log/ai-agent-service/*.log
  - job_name: storage-service
    static_configs:
      - targets: []
        labels:
          job: storage-service
          service: storage-service
          __path__: /var/log/storage-service/*.log

  # Docker containers (captures postgres and all services writing to stdout)
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_id']
        target_label: '__path__'
        replacement: '/var/lib/docker/containers/${1}/*-json.log'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      # Normalize postgres service name
      - source_labels: ['service']
        regex: 'postgres|postgresql'
        target_label: 'service'
        replacement: 'postgresql'
    pipeline_stages:
      - json:
          expressions:
            log: log
            time: time
      - timestamp:
          source: time
          format: RFC3339Nano
      - output:
          source: log
